<app-page-header [kicker]="kicker()" [title]="title()" [backLink]="backLink()" />

<main class="page-main">
  @if (!store.ready()) {
    <div class="page-stack"><p class="muted">Lade …</p></div>
  } @else {
    @if (booking(); as b) {
      <div class="infobar">
        <div class="info range-cell">
          <div class="mini-label">Zeitraum</div>
          <div class="info-value nowrap">{{ range() }}</div>
        </div>
        <div class="info price-cell">
          <label class="mini-label" for="booking-price">Preis / Besuch</label>
          <div class="price-row">
            <input
              id="booking-price"
              class="price-input"
              type="number"
              min="0"
              step="0.5"
              inputmode="decimal"
              [value]="b.price"
              [disabled]="b.archived"
              (input)="onPriceInput($event)"
              (blur)="onPriceBlur($event)"
            />
            <span class="info-value">€</span>
          </div>
        </div>
        <div class="contact">
          <span class="contact-name">{{ owner()?.name }}</span>
          @for (c of contact(); track c) {
            <span class="contact-item">{{ c }}</span>
          }
        </div>
      </div>

      <div class="tabs">
        <div class="seg" role="radiogroup" aria-label="Ansicht">
          <label class="seg-opt">
            <input
              type="radio"
              name="detail-tab"
              [checked]="tab() === 'plan'"
              (change)="tab.set('plan')"
            />Besuchsplan
          </label>
          <label class="seg-opt">
            <input
              type="radio"
              name="detail-tab"
              [checked]="tab() === 'bill'"
              (change)="tab.set('bill')"
            />Abrechnung
          </label>
        </div>
      </div>

      <div class="detail-grid" [class.show-bill]="tab() === 'bill'">
        <app-visit-plan
          class="plan-pane"
          [booking]="b"
          [sitters]="store.sitters()"
          [today]="clock.today()"
          [editable]="editable()"
          (slotSelected)="openPicker($event)"
        />
        <app-billing-panel
          class="bill-pane"
          [booking]="b"
          [ownerName]="owner()?.name ?? '?'"
          [sitters]="store.sitters()"
          [today]="clock.today()"
          (archive)="archive()"
          (restore)="restore()"
        />
      </div>
    } @else {
      <div class="page-stack">
        <div class="empty-state">Diese Betreuung gibt es nicht (mehr).</div>
      </div>
    }
  }
</main>

@if (pickerKey(); as key) {
  <app-sitter-picker
    [slotKey]="key"
    [currentSitterId]="currentSitterId()"
    [sitters]="store.sitters()"
    (picked)="assign($event)"
    (created)="createAndAssign($event)"
    (closed)="closePicker()"
  />
}
